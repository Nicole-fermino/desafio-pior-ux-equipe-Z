<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Pior Cadastro do Mundo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastre-se... Se Conseguir!</h1>
        <p id="mensagem-status">Preencha os campos abaixo com muita paciência.</p>
        
        <!-- Formulário integrado com FormSubmit (substitua o e-mail abaixo pelo seu se quiser receber os dados) -->
        <form id="chaosForm" action="https://formsubmit.co/seu-email@exemplo.com" method="POST">
            
            <!-- Configurações para o FormSubmit não travar o fluxo -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <!-- Campo Nome -->
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <!-- Campo E-mail Invertido -->
            <div class="campo">
                <label for="email">E-mail (Cuidado com a digitação):</label>
                <input type="text" id="email" name="email" placeholder="nome@exemplo.com" required>
            </div>

            <!-- Campo Senha Filósofa -->
            <div class="campo">
                <label for="senha">Senha Secreta:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                <span id="dica-senha" class="dica">Dica: A senha exige pureza espiritual (precisa conter a palavra 'chaos' e 8+ caracteres).</span>
            </div>

            <!-- Área de Botões Invertidos / Fugiços -->
            <div class="botoes">
                <!-- Botão Cancelar Gigante e Chamativo -->
                <button type="button" id="btnCancelar" class="btn-perigoso">❌ CANCELAR TUDO</button>
                
                <!-- Botão Avançar Frágil e Fugiço -->
                <button type="submit" id="btnAvancar" class="btn-quase-invisivel">Avançar</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
